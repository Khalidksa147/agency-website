<!--
  Orb hero section (Arabic home - archived)
  Swap this block back into ar/index.html <main> (replace the editorial hero)
  and remove body class "page-hero" when you want the 3D orb hero again.
  Requires #orb-canvas; main.js boots HeroOrb when that canvas exists.
-->
      <section class="hero" id="top">
        <div class="atmosphere" aria-hidden="true"></div>
        <div class="hero-orb">
          <canvas id="orb-canvas"></canvas>
        </div>

        <div class="hero-copy">
          <p class="eyebrow">
            <span data-i18n="hero.eyebrow">استوديو رقمي للسعودية</span>
            <span class="eyebrow-line" aria-hidden="true"></span>
          </p>
          <h1 data-copy data-copy-scroll="false" data-copy-delay="0.15">
            <span data-i18n="hero.line1">نبني</span>
            <span class="accent" data-i18n="hero.line2">تجارب رقمية</span>
            <span data-i18n="hero.line3">صُنعت للسعودية.</span>
          </h1>
          <p class="lede" data-copy data-copy-scroll="false" data-copy-delay="0.5" data-i18n="hero.lede">قيرام استوديو متخصص في المواقع والتطبيقات وتجربة المستخدم وأنظمة الهوية - بنفس مستوى العناية بالعربية والإنجليزية.</p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="/ar/contact/" data-magnetic="14">
              <span data-i18n="hero.cta">أخبرنا عما تبنيه</span>
              <span class="btn-arrow" aria-hidden="true">→</span>
            </a>
            <a class="btn btn-ghost" href="#work" data-magnetic="10" data-i18n="hero.secondary">شاهد أعمالنا</a>
          </div>
        </div>

        <aside class="hero-meta" aria-hidden="true">
          <span>Web</span>
          <span>Apps</span>
          <span>UX/UI</span>
          <span>Brand</span>
        </aside>

        <div class="hero-footer">
          <a class="scroll-hint" href="#services">
            <span class="scroll-track" aria-hidden="true"></span>
            <span data-i18n="hero.scroll">تمرير</span>
          </a>
          <p class="hero-tags">Ideas × Design × Development</p>
        </div>
      </section>
