<svg class="brand-svg" viewBox="0 0 360 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <style>
    .brand-svg {
      --lime: #C7F36B;
      --cyan: #4DEBFF;
      --purple: #A875FF;
      --white: #F3F6F7;
      --background: #05090B;
      --panel: #0a0f12;
      --card: #10161a;
      --ink: rgba(243, 246, 247, 0.3);
      --dur: 8s;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    .brand-svg .frame { fill: var(--panel); stroke: var(--cyan); stroke-width: 1.15; }
    .brand-svg .frame-glow { fill: none; stroke: var(--cyan); stroke-width: 1.7; opacity: 0.3; filter: url(#brand-glow); }
    .brand-svg .card { fill: var(--card); }
    .brand-svg .muted { stroke: var(--ink); stroke-width: 1.25; stroke-linecap: round; }
    .brand-svg .link { stroke: var(--cyan); stroke-width: 1.05; fill: none; opacity: 0.55; }
    .brand-svg .flow {
      stroke: var(--cyan);
      stroke-width: 2.15;
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 22 26;
      filter: url(#brand-glow);
    }
    .brand-svg .aa {
      fill: var(--white);
      font-family: Outfit, Manrope, sans-serif;
      font-weight: 300;
    }
    .brand-svg .mark-ring,
    .brand-svg .mark-tail {
      fill: none;
      stroke: url(#brand-mark-g);
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .brand-svg .mark-ring { stroke-width: 11; }
    .brand-svg .mark-tail { stroke-width: 11; }
    .brand-svg .mark-edge {
      fill: none;
      stroke: var(--cyan);
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0.8;
    }
    .brand-svg .mark-glow {
      fill: none;
      stroke: var(--lime);
      stroke-width: 17;
      stroke-linecap: round;
      opacity: 0.2;
      filter: url(#brand-glow);
    }
    .brand-svg .mark-sweep {
      fill: none;
      stroke: #F7FFE0;
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke-dasharray: 22 96;
      opacity: 0.95;
    }
    .brand-svg .icon { stroke: var(--white); stroke-width: 1.25; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.7; }
    .brand-svg .spark { fill: var(--lime); }
    .brand-svg .flow { animation: brand-flow var(--dur) linear infinite; }
    .brand-svg .aa { animation: brand-aa var(--dur) var(--ease) infinite; }
    .brand-svg .aa-scan { animation: brand-scan var(--dur) var(--ease) infinite; }
    .brand-svg .draw { animation: brand-draw var(--dur) var(--ease) infinite; }
    @keyframes brand-flow { to { stroke-dashoffset: -48; } }
    @keyframes brand-aa {
      0%, 14%, 36%, 100% { fill: var(--white); }
      20%, 28% { fill: #E8FFA3; }
    }
    @keyframes brand-scan {
      0%, 12% { transform: translateX(0); opacity: 0; }
      16% { opacity: 0.7; }
      30% { transform: translateX(62px); opacity: 0.55; }
      36%, 100% { transform: translateX(72px); opacity: 0; }
    }
    @keyframes brand-draw {
      0%, 52% { stroke-dashoffset: 80; }
      68%, 86% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 80; }
    }
    @media (prefers-reduced-motion: reduce) {
      .brand-svg .flow,
      .brand-svg .aa,
      .brand-svg .aa-scan,
      .brand-svg .draw { animation: none; }
      .brand-svg .draw { stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <linearGradient id="brand-mark-g" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8FF9A"/>
      <stop offset="0.55" stop-color="var(--lime)"/>
      <stop offset="1" stop-color="#7EE0A8"/>
    </linearGradient>
    <linearGradient id="brand-tag-g" x1="302" y1="62" x2="350" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--cyan)"/>
      <stop offset="1" stop-color="var(--purple)"/>
    </linearGradient>
    <linearGradient id="brand-scan-g" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="rgba(199,243,107,0)"/>
      <stop offset="0.5" stop-color="rgba(199,243,107,0.7)"/>
      <stop offset="1" stop-color="rgba(77,235,255,0)"/>
    </linearGradient>
    <filter id="brand-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.55" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="brand-mark-ring" d="M20.2-1.6 A20.4 20.4 0 1 0 16.4 12.4"/>
    <path id="brand-mark-tail" d="M6.4 7.2 L20.6 21.2"/>
    <path id="brand-mark-edge" d="M-9.2-17.2 A20.4 20.4 0 0 1 11.4-16.4"/>
    <path id="brand-spark-shape" d="M0-10L1.25-1.25 10 0 1.25 1.25 0 10-1.25 1.25-10 0-1.25-1.25Z"/>
  </defs>

  <g id="brand-links">
    <path class="link" d="M46 16 H338"/>
    <path class="link" d="M29 78 V172"/>
    <path class="link" d="M46 224 H214"/>
    <path class="link" d="M323 16 V62"/>
    <path class="flow" d="M46 16 H338">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="8s" repeatCount="indefinite"/>
    </path>
    <path class="flow" d="M29 78 V172">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="8s" begin="2.1s" repeatCount="indefinite"/>
    </path>
    <path class="flow" d="M323 16 V62">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="8s" begin="4.4s" repeatCount="indefinite"/>
    </path>
    <rect x="13" y="75" width="6" height="6" fill="none" stroke="var(--cyan)" stroke-width="1.05">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="338" cy="16" r="2.2" fill="var(--lime)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="8s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="214" cy="224" r="2" fill="var(--purple)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="8s" begin="5.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g id="brand-rail">
    <rect class="frame" x="14" y="70" width="24" height="24" rx="4"/>
    <path class="icon" d="M20 86 L26 80 L32 86"/>
    <circle cx="30" cy="78" r="1.3" fill="var(--cyan)"/>
    <rect class="frame" x="14" y="108" width="24" height="24" rx="4" stroke="var(--purple)"/>
    <path class="icon" d="M21 116 H31 M26 116 V126" stroke="var(--white)"/>
    <rect class="frame" x="14" y="146" width="24" height="24" rx="4"/>
    <path class="icon" d="M26 152 C29 155 31 158 26 164 C21 158 23 155 26 152Z" fill="none" stroke="var(--lime)"/>
  </g>

  <g id="brand-logo-card">
    <rect class="frame-glow" x="50" y="20" width="140" height="198" rx="9"/>
    <rect class="frame" x="50" y="20" width="140" height="198" rx="9"/>
    <path class="muted" d="M64 32 H98"/>
    <path class="muted" d="M168 32 H176"/>
    <g transform="translate(120 108)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1.07;1;1.035;1" keyTimes="0;0.12;0.24;0.38;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.22 1 0.36 1; 0.22 1 0.36 1; 0.22 1 0.36 1; 0.22 1 0.36 1"/>
        <use href="#brand-mark-ring" class="mark-glow">
          <animate attributeName="opacity" values="0.12;0.72;0.18;0.5;0.12" keyTimes="0;0.12;0.26;0.4;1" dur="8s" repeatCount="indefinite"/>
        </use>
        <use href="#brand-mark-tail" class="mark-glow"/>
        <use href="#brand-mark-ring" class="mark-ring"/>
        <use href="#brand-mark-tail" class="mark-tail"/>
        <use href="#brand-mark-edge" class="mark-edge">
          <animate attributeName="opacity" values="0.35;1;0.4;0.85;0.35" keyTimes="0;0.12;0.26;0.4;1" dur="8s" repeatCount="indefinite"/>
        </use>
        <use href="#brand-mark-ring" class="mark-sweep">
          <animate attributeName="stroke-dashoffset" values="0;-118" dur="8s" repeatCount="indefinite"/>
        </use>
      </g>
    </g>
    <path class="muted" d="M72 188 H168" pathLength="80"/>
    <path class="muted draw" d="M72 198 H148" pathLength="80" stroke-dasharray="80">
      <animate attributeName="stroke-dashoffset" values="80;80;0;0;80" keyTimes="0;0.08;0.22;0.82;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="rgba(243,246,247,0.28); #C7F36B; rgba(243,246,247,0.28)" keyTimes="0;0.16;1" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g id="brand-type-card">
    <rect class="frame-glow" x="200" y="20" width="94" height="58" rx="6"/>
    <rect class="card" x="200" y="20" width="94" height="58" rx="6" stroke="var(--cyan)" stroke-width="1.1"/>
    <rect class="aa-scan" x="208" y="26" width="14" height="44" fill="url(#brand-scan-g)" opacity="0">
      <animate attributeName="x" values="208;208;268;274" keyTimes="0;0.14;0.3;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0.15;0" keyTimes="0;0.14;0.2;0.32;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text class="aa" x="212" y="60" font-size="30">A</text>
    <text class="aa" x="237" y="60" font-size="23">a</text>
    <path class="muted" d="M268 36 H286"/>
    <path class="muted" d="M268 46 H282"/>
    <path class="muted" d="M268 56 H278"/>
    <animate attributeName="opacity" values="0.82;1;0.82" dur="8s" begin="1.1s" repeatCount="indefinite"/>
  </g>

  <g id="brand-palette">
    <rect class="card" x="200" y="86" width="94" height="40" rx="6" stroke="rgba(77,235,255,0.6)" stroke-width="1.05"/>
    <g id="swatch-1">
      <rect x="210" y="97" width="13" height="17" rx="2.5" fill="var(--lime)" opacity="0.42">
        <animate attributeName="opacity" values="0.42;1;1;0.42;0.42" keyTimes="0;0.3;0.4;0.48;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="208.5" y="95.5" width="16" height="20" rx="3.5" fill="none" stroke="var(--white)" stroke-width="1.1" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.3;0.4;0.48;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g id="swatch-2">
      <rect x="228" y="97" width="13" height="17" rx="2.5" fill="var(--cyan)" opacity="0.42">
        <animate attributeName="opacity" values="0.42;0.42;1;1;0.42;0.42" keyTimes="0;0.38;0.42;0.52;0.6;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="226.5" y="95.5" width="16" height="20" rx="3.5" fill="none" stroke="var(--white)" stroke-width="1.1" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.42;0.52;0.6;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g id="swatch-3">
      <rect x="246" y="97" width="13" height="17" rx="2.5" fill="var(--purple)" opacity="0.42">
        <animate attributeName="opacity" values="0.42;0.42;1;1;0.42;0.42" keyTimes="0;0.5;0.54;0.64;0.72;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="244.5" y="95.5" width="16" height="20" rx="3.5" fill="none" stroke="var(--white)" stroke-width="1.1" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.54;0.64;0.72;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g id="swatch-4">
      <rect x="264" y="97" width="13" height="17" rx="2.5" fill="#D7C4FF" opacity="0.42">
        <animate attributeName="opacity" values="0.42;0.42;1;1;0.42;0.42" keyTimes="0;0.62;0.66;0.76;0.84;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="262.5" y="95.5" width="16" height="20" rx="3.5" fill="none" stroke="var(--white)" stroke-width="1.1" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.66;0.76;0.84;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g id="swatch-5">
      <rect x="282" y="97" width="13" height="17" rx="2.5" fill="var(--white)" opacity="0.42">
        <animate attributeName="opacity" values="0.42;0.42;1;1;0.42" keyTimes="0;0.74;0.78;0.88;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="280.5" y="95.5" width="16" height="20" rx="3.5" fill="none" stroke="var(--lime)" stroke-width="1.1" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.78;0.88;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g id="brand-asset-card">
    <rect class="card" x="200" y="134" width="94" height="50" rx="6" stroke="rgba(77,235,255,0.55)" stroke-width="1.05"/>
    <g transform="translate(220 159) scale(0.42)">
      <use href="#brand-mark-ring" class="mark-ring"/>
      <use href="#brand-mark-tail" class="mark-tail"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="8s" begin="5.2s" repeatCount="indefinite"/>
    </g>
    <path class="muted draw" d="M238 148 H282" pathLength="80" stroke-dasharray="80">
      <animate attributeName="stroke-dashoffset" values="80;80;0;0;80" keyTimes="0;0.58;0.7;0.88;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <path class="muted draw" d="M238 158 H274" pathLength="80" stroke-dasharray="80">
      <animate attributeName="stroke-dashoffset" values="80;80;0;0;80" keyTimes="0;0.62;0.74;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <path class="muted" d="M238 168 H266"/>
  </g>

  <g id="brand-tag">
    <path class="link" d="M323 16 V64"/>
    <path class="flow" d="M323 16 V64">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="8s" begin="4.4s" repeatCount="indefinite"/>
    </path>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2.6 323 64; 2.6 323 64; -2.6 323 64" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <rect class="frame-glow" x="302" y="64" width="42" height="122" rx="6"/>
      <rect class="card" x="302" y="64" width="42" height="122" rx="6" stroke="url(#brand-tag-g)" stroke-width="1.15"/>
      <circle cx="323" cy="75" r="2.6" fill="none" stroke="rgba(243,246,247,0.32)" stroke-width="1.15"/>
      <g transform="translate(323 128) scale(0.46)">
        <use href="#brand-mark-ring" class="mark-glow">
          <animate attributeName="opacity" values="0.1;0.1;0.7;0.15" keyTimes="0;0.62;0.74;1" dur="8s" repeatCount="indefinite"/>
        </use>
        <use href="#brand-mark-ring" class="mark-ring"/>
        <use href="#brand-mark-tail" class="mark-tail"/>
      </g>
    </g>
  </g>

  <g id="brand-sparkles">
    <use href="#brand-spark-shape" class="spark" transform="translate(38 18)" fill="var(--white)">
      <animate attributeName="opacity" values="0.2;1;0.2;0.2" keyTimes="0;0.08;0.18;1" dur="8s" repeatCount="indefinite"/>
    </use>
    <use href="#brand-spark-shape" class="spark" transform="translate(338 18) scale(1.2)" fill="var(--lime)">
      <animate attributeName="opacity" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.28;0.36;0.48;1" dur="8s" repeatCount="indefinite"/>
    </use>
    <use href="#brand-spark-shape" class="spark" transform="translate(188 224) scale(0.78)" fill="var(--lime)">
      <animate attributeName="opacity" values="0.18;0.18;1;0.18" keyTimes="0;0.7;0.8;1" dur="8s" repeatCount="indefinite"/>
    </use>
  </g>
</svg>
